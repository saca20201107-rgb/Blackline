<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ОСТЕМИР — Караганда</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090A;--fg:#F6F5F2;--muted:#9B9B9B;--gold:#C6A87D;--line:rgba(255,255,255,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Manrope',sans-serif}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(9,9,10,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:'Syne';font-weight:800;letter-spacing:.18em;font-size:14px}
.cta{background:var(--fg);color:#000;padding:9px 16px;border-radius:999px;text-decoration:none;font-weight:800;font-size:12px}
.hero{padding:92px 18px 28px}
.hero h1{font-family:'Syne';font-weight:800;line-height:.88;letter-spacing:-.03em;font-size:clamp(32px,9vw,72px);max-width:720px}
.hero h1 .gold{color:var(--gold)} .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;display:inline-block;margin-left:6px}
.hero p{margin-top:16px;color:var(--muted);font-size:15px;line-height:1.5;max-width:440px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.badge{border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gallery{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;padding:0 10px}
@media(max-width:640px){.gallery{grid-template-columns:1fr}}
.g{border-radius:20px;overflow:hidden;position:relative;background:#141414;border:1px solid var(--line)}
.g img{width:100%;height:100%;object-fit:cover;display:block}
.g.h440{height:440px} .g.h214{height:214px}
@media(max-width:640px){.g.h440,.g.h214{height:380px}}
.g .cap{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);padding:6px 10px;border-radius:999px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.section{padding:44px 18px;border-top:1px solid var(--line)}
.h2{font-family:'Syne';font-size:clamp(22px,5.5vw,36px);line-height:.95;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.price{color:var(--gold);font-weight:800}
.mapWrap{margin-top:18px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#111}
.mapWrap iframe{width:100%;height:380px;border:0}
.contactGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(max-width:700px){.contactGrid{grid-template-columns:1fr}}
.box{background:#121212;border:1px solid var(--line);border-radius:18px;padding:18px}
.box small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px}
.box .big{margin-top:8px;font-size:18px;font-weight:800;line-height:1.2}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions a{text-decoration:none;padding:11px 16px;border-radius:999px;font-weight:800;font-size:13px;flex:1;text-align:center}
.a-wa{background:#25D366;color:#000} .a-call{background:var(--gold);color:#000} .a-gis{background:#fff;color:#000}
.footer{padding:20px 18px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
</style></head><body>
